; Limites d'envoi PHP, lues par l'hébergement OVH (fichier à laisser à la racine
; du site). Sans elles, upload_max_filesize vaut souvent 2 Mo et une seule photo
; de téléphone suffit à faire échouer l'envoi, silencieusement.
;
; post_max_size doit rester supérieur à upload_max_filesize × nombre de photos,
; sinon PHP vide $_POST entier sans prévenir.
upload_max_filesize = 12M
post_max_size = 48M
max_file_uploads = 10
max_execution_time = 120
memory_limit = 256M
